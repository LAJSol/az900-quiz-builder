<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AZ-900 Quiz Builder (Unofficial)</title>
  </head>
  <body>
    <!-- App shell: three screens, only one visible at a time. -->
    <div id="app">
      <!-- ============ HOME SCREEN ============ -->
      <section id="screen-home" class="screen is-active" aria-label="Choose a topic">
        <header class="app-header">
          <h1>AZ-900 Quiz Builder</h1>
          <p class="subtitle">Pick a topic to start practicing for the Azure Fundamentals exam.</p>
        </header>

        <main class="content">
          <!-- Topic cards are generated by script.js -->
          <div id="topic-list" class="topic-list"></div>
        </main>
      </section>

      <!-- ============ QUESTION SCREEN ============ -->
      <section id="screen-quiz" class="screen" aria-label="Quiz">
        <header class="app-header quiz-header">
          <div class="quiz-meta">
            <span id="quiz-topic" class="quiz-topic"></span>
            <span id="quiz-score" class="quiz-score">Score: 0</span>
          </div>
          <!-- Progress bar updates as the user answers -->
          <div class="progress-wrap">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <p id="progress-label" class="progress-label">Question 1 of 5</p>
        </header>

        <main class="content">
          <div id="question-card" class="question-card">
            <h2 id="question-text" class="question-text"></h2>
            <!-- Options are generated by script.js -->
            <ul id="options-list" class="options-list" role="listbox"></ul>

            <!-- Explanation box only appears after an answer is picked -->
            <div id="feedback" class="feedback" hidden>
              <p id="feedback-verdict" class="feedback-verdict"></p>
              <p id="feedback-explanation" class="feedback-explanation"></p>
              <button id="next-btn" class="btn btn-primary" type="button">Next</button>
            </div>
          </div>
        </main>
      </section>

      <!-- ============ RESULTS SCREEN ============ -->
      <section id="screen-results" class="screen" aria-label="Results">
        <header class="app-header">
          <h1>Results</h1>
        </header>

        <main class="content">
          <div class="results-card">
            <!-- Circular progress ring. JS sets the stroke-dashoffset. -->
            <div class="results-ring-wrap">
              <svg class="results-ring" viewBox="0 0 140 140" aria-hidden="true">
                <circle class="ring-track"    cx="70" cy="70" r="62"></circle>
                <circle id="ring-progress" class="ring-progress" cx="70" cy="70" r="62"></circle>
              </svg>
              <div class="results-ring-label">
                <span id="results-score" class="results-score"></span>
                <span id="results-score-sub" class="results-score-sub"></span>
              </div>
            </div>
            <p id="results-message" class="results-message"></p>

            <!-- Missed questions appear here; hidden if none. -->
            <div id="review-section" class="review-section" hidden>
              <h2>Review what you got wrong</h2>
              <div id="review-list" class="review-list"></div>
            </div>

            <div class="results-actions">
              <button id="retry-btn" class="btn btn-primary" type="button">Retry this topic</button>
              <button id="home-btn" class="btn btn-secondary" type="button">Pick another topic</button>
            </div>
          </div>
        </main>
      </section>
    </div>

    <!-- Footer shown on every screen -->
    <footer class="app-footer">
      Unofficial study tool. Not affiliated with Microsoft.
    </footer>

    <!-- Load order matters: questions first (data), then the app logic. -->
    <script type="module" src="./questions.js"></script>
    <script type="module" src="./script.js"></script>
  </body>
</html>
